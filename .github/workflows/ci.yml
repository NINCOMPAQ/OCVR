name: ci

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The exact pre-embedding datasets are tracked by Git LFS. The
          # release verifier checks their real byte sizes and SHA-256 hashes.
          lfs: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: >-
          python -m pip install
          pytest==8.4.1
          ruff==0.16.4
          "fastapi>=0.115,<1"
          "httpx>=0.27,<1"
      - run: git lfs fsck
      - run: python -m compileall -q src tests
      - run: PYTHONPATH=src python -m pytest -q
      - run: ruff check .
      - run: ruff format --check .
      - run: PYTHONPATH=src python scripts/verify_release.py --allow-unpublished-data
